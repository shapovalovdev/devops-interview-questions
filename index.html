<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A public, searchable database of DevOps interview questions." />
    <title>DevOps Question Field Manual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <main>
      <header class="masthead">
        <p class="eyebrow">FIELD MANUAL / 001</p>
        <div class="heading-row">
          <h1>DevOps<br /><em>Question</em> Field Manual.</h1>
          <p class="manifesto">A practical collection for the people who keep systems moving when the map ends.</p>
        </div>
        <div class="statusbar" aria-label="Database status">
          <span><b id="question-count">11</b> questions</span>
          <span><b id="theme-count">11</b> themes</span>
          <span>CC BY 4.0</span>
        </div>
      </header>

      <section class="control-room" aria-labelledby="browse-heading">
        <div>
          <p class="eyebrow" id="browse-heading">BROWSE THE SYSTEM</p>
          <label class="search-label" for="search">Find a concept, tool, or failure mode</label>
          <input id="search" type="search" placeholder="e.g. DNS, rollout, secret…" autocomplete="off" />
        </div>
        <div class="filters" id="filters" aria-label="Filter questions by theme"></div>
      </section>

      <section class="question-zone" aria-live="polite">
        <p class="result-line" id="result-line"></p>
        <div class="question-grid" id="question-grid"></div>
      </section>
    </main>

    <footer>
      <span>ORIGINAL / PARAPHRASED CONTENT</span>
      <a href="CONTRIBUTING.md">CONTRIBUTE A QUESTION ↗</a>
      <a href="https://github.com/shapovalovdev/devops-interview-questions">VIEW SOURCE ↗</a>
    </footer>
    <script src="assets/questions.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
