name: Validate question database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate every active Question
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Content store takes each record's updated_at from its file's git
          # commit time, so a shallow clone would leave every one at the epoch
          # and make the Drift check compare against a store the build cannot
          # reproduce.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Markdown sources and catalog coverage
        # Every tests/validate_*.py is discovered and run, so a new validator
        # needs no edit here. tests/test_validator_discovery.py proves the
        # discovered set matches the disk, and refuses a validator named in
        # this file: listing one here would state the set twice.
        #
        # The test_*.py modules that used to be listed are already discovered
        # by run_all_tests.py below -- naming them here ran them twice.
        run: python tests/run_validators.py --check-live

      - name: Refuse Drift between the corpus and the Content store
        # Markdown in git stays the durable record only if a store built from it
        # exports back to exactly these files. See docs/adr/0001-*.md.
        run: python -m contentdb.drift

      - name: Run every Theme and certification regression test
        # Runs each module's TestCase classes, bare test_* functions, and main().
        # Invoking the files directly skipped sixteen checks that had no runner.
        run: python tests/run_all_tests.py

  validate-site:
    name: Validate website behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        # GitHub-hosted Ubuntu already has Chromium's runtime libraries.
        # Avoiding `--with-deps` keeps Playwright from running apt against a
        # flaky mirror before it downloads the browser.
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip playwright
          if ! timeout --foreground 8m python -m playwright install chromium; then
            echo "::error title=Playwright browser installation failed::Chromium installation exceeded its 8-minute limit or failed. Check the Playwright download service, then rerun."
            exit 1
          fi
      - name: Verify search, filters, and rendered Question links
        # This is a second boundary in case Chromium itself or a browser action
        # stops responding despite the individual Playwright operation limits.
        timeout-minutes: 5
        run: python tests/site_check.py
