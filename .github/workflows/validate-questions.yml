name: Validate question database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate every active Question
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Content store takes each record's updated_at from its file's git
          # commit time, so a shallow clone would leave every one at the epoch
          # and make the Drift check compare against a store the build cannot
          # reproduce.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Markdown sources and catalog coverage
        run: |
          python tests/validate_content_manifest.py
          python tests/validate_certification_question_workflow.py
          python tests/validate_questions.py
          python tests/validate_labs.py
          python tests/test_theme_coverage_policy.py
          python tests/validate_learning_resources.py --check-live
          python tests/test_validate_learning_resources.py
          python tests/test_validate_labs.py

      - name: Refuse Drift between the corpus and the Content store
        # Markdown in git stays the durable record only if a store built from it
        # exports back to exactly these files. See docs/adr/0001-*.md.
        run: python -m contentdb.drift

      - name: Run every Theme and certification regression test
        # Runs each module's TestCase classes, bare test_* functions, and main().
        # Invoking the files directly skipped sixteen checks that had no runner.
        run: python tests/run_all_tests.py

  validate-site:
    name: Validate website behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        # `--with-deps` shells out to apt as well as downloading Chromium. Bound
        # it here because a stalled package mirror otherwise holds the workflow
        # indefinitely before any website assertion can run.
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip playwright
          if ! timeout --foreground 8m python -m playwright install --with-deps chromium; then
            echo "::error title=Playwright browser installation failed::Chromium installation exceeded its 8-minute limit or failed. Check the Playwright download and Ubuntu package mirrors, then rerun."
            exit 1
          fi
      - name: Verify search, filters, and rendered Question links
        # This is a second boundary in case Chromium itself or a browser action
        # stops responding despite the individual Playwright operation limits.
        timeout-minutes: 5
        run: python tests/site_check.py
