apiVersion: v1
kind: Service
metadata:
  name: {{ include "content-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "content-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "content-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
