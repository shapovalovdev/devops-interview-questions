apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "content-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "content-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "content-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "content-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "content-api.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # emptyDir starts root-owned; fsGroup gives the non-root init process
        # permission to seed the copied SQLite database and its journal path.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The writable volume masks the image's /srv/data, so seed it before the
        # API starts. SQLite needs this directory for its journal even read APIs
        # open the database in mode=rw on a mutation attempt.
        - name: seed-content-store
          image: {{ include "content-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cp", "/srv/data/content.db", "/work/content.db"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content-store
              mountPath: /work
      containers:
        - name: content-api
          image: {{ include "content-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # SQLite journals beside content.db; no other runtime path is writable.
            - name: content-store
              mountPath: /srv/data
      volumes:
        - name: content-store
          emptyDir: {}
