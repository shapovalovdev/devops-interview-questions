replicaCount: 1

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # Only the k3d development overlay may use a tag. All other renders require
  # a sha256 digest so Kubernetes cannot resolve a mutable image identity.
  local: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
