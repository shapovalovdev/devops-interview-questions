  /api/v1/learning-paths/{slug}:
    get:
      operationId: getLearningPath
      tags: [Learning paths]
      summary: Read one learning path, with its ordered steps.
      x-implementation: implemented
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The learning path.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPath'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/search:
    get:
      operationId: search
      tags: [Search]
      summary: Search Questions and Labs together, ranked by relevance.
      x-implementation: implemented
      parameters:
        - name: q
          in: query
          required: true
          description: |
            The search text.  It is required: a search with no query is
            meaningless, and its absence is a `422`, not an empty result.
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: false
          description: Restrict the result to one kind of item.
          schema:
            $ref: '#/components/schemas/ItemKind'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A ranked page of hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before the page starts.
      schema:
        type: integer
        minimum: 0
        default: 0

    Sort:
      name: sort
      in: query
      required: false
      description: |
        Sort key, optionally prefixed `-` for descending.  The default `id`
        makes pagination deterministic, which is the whole point of pinning a
        default at all.
      schema:
        $ref: '#/components/schemas/SortKey'

    FreeText:
      name: q
      in: query
      required: false
      description: Free-text filter over title, prompt, and body.
      schema:
        type: string

    ThemePath:
      name: theme
      in: path
      required: true
      description: The canonical Theme half of the item's id.
      schema:
        type: string

    SlugPath:
      name: slug
      in: path
      required: true
      description: The slug half of the item's id.
      schema:
        type: string

    WriteCredential:
      name: X-API-Key
      in: header
      required: false
      description: |
        The Write credential.  Declared optional so that a missing credential
        is answered with `401` rather than a schema validation `422`.
      schema:
        type: string

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `content_hash` the client believes the item currently has.
        Declared optional so that its absence is the documented `428`.
      schema:
        type: string

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An ETag the client already holds; a match is answered `304`.
      schema:
        type: string

  headers:

    ETag:
      description: The item's `content_hash`, quoted.
      schema:
        type: string

  responses:

    NotModified:
      description: The client's ETag still matches; no body is returned.

    Unauthorized:
      description: No Write credential was presented.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: The Write credential presented is not the expected one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: No item with that id exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: An item with that id already exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    PreconditionFailed:
      description: The `If-Match` value is stale; someone else wrote first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableContent:
      description: |
        The request is malformed, or it breaks a rule the Markdown validators
        enforce — an unknown Theme, an unknown tag, a dangling `question_ref`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    PreconditionRequired:
      description: The request must carry `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ReadOnly:
      description: |
        No Write credential is configured, so the service runs read-only and
        refuses every write rather than defaulting to a well-known key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: The service failed unexpectedly. The body never carries a stack trace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Difficulty:
      type: string
      enum: [junior, middle, senior, staff]

    QuestionType:
      type: string
      enum: [theory, scenario, troubleshooting]

    ItemKind:
      type: string
      enum: [question, lab]

    SortKey:
      type: string
      enum:
        - id
        - -id
        - title
        - -title
        - difficulty
        - -difficulty
        - updated_at
        - -updated_at
      default: id

    HealthReport:
      type: object
      required: [status, service, contract_version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          description: The name of this service.
        contract_version:
          type: string
          description: The major version of the contract this build serves.

    Source:
      type: object
      description: An external document used to verify a Question's factual claims.
      required: [url, source_type, verified_on]
      properties:
        url:
          type: string
        source_type:
          type: string
          enum: [standard, official-docs, official-api]
        verified_on:
          type: string
          format: date

    Question:
      type: object
      required:
        - id
        - theme
        - slug
        - title
        - difficulty
        - type
        - tags
        - sources
        - prompt
        - answer_guide
        - body_markdown
        - source_path
        - content_hash
        - updated_at
      properties:
        id:
          type: string
          description: '`<theme>/<slug>`, matching the path under `questions/` without `.md`.'
        theme:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        type:
          $ref: '#/components/schemas/QuestionType'
        tags:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        prompt:
          type: string
          description: The question itself.
        answer_guide:
          type: array
          description: The expected points that characterize a strong answer.
          items:
            type: string
        body_markdown:
          type: string
        source_path:
          type: string
        content_hash:
          type: string
