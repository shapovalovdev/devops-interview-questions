  /api/v1/themes:
    get:
      operationId: listThemes
      tags: [Taxonomy]
      summary: List every canonical Theme with its counts.
      description: |
        Themes are derived from `config/content-manifest.json` and the corpus,
        so the collection is small and is returned whole; the envelope still
        applies, with `limit` reporting the size of the page returned.
      x-implementation: implemented
      responses:
        '200':
          description: Every Theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemePage'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/themes/{name}:
    get:
      operationId: getTheme
      tags: [Taxonomy]
      summary: Read one Theme by its canonical name.
      x-implementation: implemented
      parameters:
        - name: name
          in: path
          required: true
          description: The canonical Theme name, as in `config/content-manifest.json`.
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The Theme.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
