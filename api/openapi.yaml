# The API contract for the Content API, version 1.
#
# This file is hand-written and is the source of truth for the wire format.
# The service is tested against it (`tests/api/test_contract.py`); it is never
# generated from the service, because a contract derived from an
# implementation cannot catch the implementation drifting.
#
# The contract describes the whole v1 surface from the day it is written.  An
# operation that is not implemented yet carries `x-implementation: stub` and
# answers `501` until the slice that owns it lands; an implemented one carries
# `x-implementation: implemented`.  `501` is deliberately absent from the
# documented responses below: it is a fact about today's build, not a promise
# of the published scheme, and the marker is what records it.  The coverage
# census (`tests/api/test_coverage_census.py`) reads the marker to decide
# whether an operation owes a test per documented status code or a single
# `501` test.  By the end of the epic no `stub` marker may remain.
#
# Conventions that hold everywhere and are therefore stated once:
#
# - List responses are enveloped as `{items, total, limit, offset}` so a client
#   can page without guessing how much it has not seen.
# - Errors are `application/problem+json` per RFC 9457.  A stack trace is never
#   part of a body.
# - Reads are anonymous.  Every mutating request carries a Write credential in
#   `X-API-Key`; the header is declared optional in the schema on purpose, so
#   that omitting it produces the documented `401` rather than a schema `422`.
# - `If-Match` on `PUT`, `PATCH`, and `DELETE` carries the item's
#   `content_hash`.  It is declared optional for the same reason: a missing
#   precondition is a documented `428`, not a malformed request.

openapi: 3.1.0

info:
  title: Content API
  version: 1.0.0
  summary: Query and maintain the Question and Lab corpus in the Content store.
  description: |
    The Content API serves the Questions and Labs that live as Markdown under
    `questions/` and `labs/` and are loaded into the Content store by Ingest.
    Markdown in git stays the durable, reviewable record: writes accepted here
    are rendered back to Markdown by Export, and CI refuses Drift between the
    two.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

tags:
  - name: Service
    description: Liveness and contract identification.
  - name: Questions
    description: The interview prompts that make up the corpus.
  - name: Labs
    description: Hands-on exercises, each preparing a learner for one Question.
  - name: Taxonomy
    description: Themes and tags, derived from the corpus rather than authored.
  - name: Learning paths
    description: Deliberate sequences through the corpus.
  - name: Search
    description: Free-text search across Questions and Labs together.

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Service]
      summary: Report that the service is up and which contract it serves.
      x-implementation: implemented
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'

  /api/v1/questions:
    get:
      operationId: listQuestions
      tags: [Questions]
      summary: List Questions, filtered, sorted, and paginated.
      x-implementation: implemented
      parameters:
        - name: theme
          in: query
          required: false
          description: Canonical Theme that owns the Question.
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Difficulty'
        - name: type
          in: query
          required: false
          description: The interview format of the Question.
          schema:
            $ref: '#/components/schemas/QuestionType'
        - name: tag
          in: query
          required: false
          description: A single tag; a Question matches when it carries the tag.
          schema:
            type: string
        - $ref: '#/components/parameters/FreeText'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createQuestion
      tags: [Questions]
      summary: Create a Question.
      x-implementation: stub
      parameters:
        - $ref: '#/components/parameters/WriteCredential'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWrite'
      responses:
        '201':
          description: The Question was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '503':
          $ref: '#/components/responses/ReadOnly'

  /api/v1/questions/{theme}/{slug}:
    get:
      operationId: getQuestion
      tags: [Questions]
      summary: Read one Question by its id.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/ThemePath'
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The Question.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: replaceQuestion
      tags: [Questions]
      summary: Replace a Question wholesale.
      x-implementation: stub
      parameters:
        - $ref: '#/components/parameters/ThemePath'
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/WriteCredential'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWrite'
      responses:
        '200':
          description: The replaced Question.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ReadOnly'
    patch:
      operationId: patchQuestion
      tags: [Questions]
      summary: Change only the supplied fields of a Question.
      x-implementation: stub
      parameters:
        - $ref: '#/components/parameters/ThemePath'
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/WriteCredential'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
      responses:
        '200':
          description: The patched Question.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ReadOnly'
    delete:
      operationId: deleteQuestion
      tags: [Questions]
      summary: Delete a Question.
      x-implementation: stub
      parameters:
        - $ref: '#/components/parameters/ThemePath'
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/WriteCredential'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The Question is gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ReadOnly'

