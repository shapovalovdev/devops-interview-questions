    get:
      operationId: listTags
      tags: [Taxonomy]
      summary: List every tag with its counts.
      description: |
        Tags come from `TAGS.md` and the corpus and are returned whole, with
        `limit` reporting the size of the page returned.
      x-implementation: implemented
      responses:
        '200':
          description: Every tag.
          content:
