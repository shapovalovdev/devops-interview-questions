id: sre-telemetry
name: Senior SRE & Telemetry Architecture
description: Reliability engineering, SLI/SLO mathematical modeling, error budgets, Prometheus metrics, Loki logs, and chaos injection
icon: "📊"
color: "#f59e0b"
target_audience: Site Reliability Engineers, Production Operations, and SRE Leads
certifications:
  - CKA
steps:
  - id: step-sre-sli-slo
    skill_id: sre-sli-slo
    title: SLI/SLO Definition & User Journeys
    description: Formulate critical user journeys, good-event SLIs, 99.9% SLO targets, and consequence-driven error budget policies.
    difficulty: middle
    theme: observability
    question_id: observability/define-an-sli-and-slo
    lab_slug: observability/prometheus-loki-telemetry
    concepts:
      - Good Events / Total Events
      - Error Budget Depletion Rate
      - 28-Day Rolling Windows
      - Freeze vs Deploy Policies
    prerequisites: []

  - id: step-sre-prom-loki
    skill_id: sre-prom-loki
    title: Prometheus PromQL & Loki LogQL Telemetry
    description: Construct rate/histogram PromQL calculations and query structured JSON logs with LogQL stream filters.
    difficulty: senior
    theme: observability
    question_id: observability/use-recording-rules
    lab_slug: observability/prometheus-loki-telemetry
    concepts:
      - PromQL histogram_quantile
      - Multi-window Burn Alerts
      - LogQL Stream Selectors
      - High Cardinality Defenses
    prerequisites:
      - step-sre-sli-slo

  - id: step-sre-alerts-oncall
    skill_id: sre-alerts-oncall
    title: Alert Routing, Multi-window Burn Rates & On-Call
    description: Build multi-window multi-burn-rate Alertmanager rules to avoid false alarms while paging on rapid budget depletion.
    difficulty: senior
    theme: sre
    question_id: sre/design-multiwindow-burn-alert
    lab_slug: sre/chaos-on-a-leash
    concepts:
      - 14.4x 1-hour / 6-hour Burn Alerts
      - PagerDuty/Alertmanager Routing
      - Alert Fatigue Elimination
      - Actionable Runbook Links
    prerequisites:
      - step-sre-prom-loki

  - id: step-sre-incident-postmortem
    skill_id: sre-incident-postmortem
    title: Incident Coordination & Blameless Postmortems
    description: Direct incident command structures, communications leads, timeline collation, and root cause prevention action items.
    difficulty: senior
    theme: sre
    question_id: sre/write-blameless-postmortem
    lab_slug: sre/chaos-on-a-leash
    concepts:
      - Incident Commander Roles
      - Second-Order Root Causes
      - Systemic Action Items
      - Blameless Culture Principles
    prerequisites:
      - step-sre-alerts-oncall

  - id: step-sre-chaos-injection
    skill_id: sre-chaos-injection
    title: Controlled Chaos Experiments & Resilience
    description: Apply network delay, packet loss, and memory pressure to prove automated failover and graceful degradation.
    difficulty: senior
    theme: chaos-engineering
    question_id: chaos-engineering/inject-latency-into-a-dependency
    lab_slug: sre/chaos-on-a-leash
    concepts:
      - Hypothesis-driven Testing
      - Steady-State Verification
      - Automated Abort Triggers
      - Blast Radius Isolation
    prerequisites:
      - step-sre-incident-postmortem
