# The API suite lives in tests/api/ and needs FastAPI, Pydantic, and httpx.
# `tests/run_all_tests.py` globs `tests/test_*.py` non-recursively, so the
# standard-library-only suite never reaches into this directory.
#
# `--cov=api --cov=contentdb` is the gate the epic sets, so the Content store's
# own checks are collected here too. They are plain `unittest` modules and keep
# running under `tests/run_all_tests.py`, which needs no third-party package;
# listing them here only means the coverage number describes both halves of the
# service rather than the half that happens to live beside a conftest.
#
# `testpaths` used to name each contentdb module individually. That is the same
# hand-maintained list the workflow kept for validators, and it failed the same
# way: tests/test_contentdb_drift.py was added and simply was not collected
# here, so the Drift gate's new tests never reached the coverage gate and
# drift.py still reported 87.5%. The glob collects whatever exists, and
# tests/test_coverage_floors.py asserts the collected set matches the disk.
[pytest]
testpaths =
    tests/api
    tests/test_contentdb_*.py
